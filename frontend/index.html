<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive floor plan viewer for OCS Inventory — map and manage physical IT infrastructure." />
    <title>floorplan — OCS Inventory</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>

    <!-- ── Topbar ──────────────────────────────────────────────── -->
    <header class="fp-topbar">
      <div class="fp-topbar__brand">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="1" width="16" height="16" rx="2"/>
          <line x1="1" y1="9" x2="17" y2="9"/>
          <line x1="9" y1="1" x2="9" y2="17"/>
        </svg>
        floorplan
      </div>

      <div class="fp-topbar__search">
        <input
          id="search-input"
          class="fp-topbar__input"
          type="text"
          placeholder="Search by hostname, IP or MAC…"
          autocomplete="off"
        />
        <button id="search-btn" class="fp-btn fp-btn--primary fp-btn--sm">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="7" cy="7" r="5"/>
            <line x1="11" y1="11" x2="14.5" y2="14.5"/>
          </svg>
          Search
        </button>
      </div>
    </header>

    <!-- ── Breadcrumb ──────────────────────────────────────────── -->
    <nav id="breadcrumb" class="fp-breadcrumb">
      <span>Loading…</span>
    </nav>

    <!-- ── Search Results Overlay ──────────────────────────────── -->
    <div id="search-results" class="fp-search-results"></div>

    <!-- ── Main Layout ─────────────────────────────────────────── -->
    <div class="fp-layout">

      <!-- Sidebar -->
      <aside class="fp-sidebar">
        <div class="fp-sidebar__section">
          <div class="fp-sidebar__title">Tools</div>
          <div class="fp-sidebar__tools">
            <button id="btn-edit" class="fp-btn" title="Toggle Edit Mode">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11.5 1.5 14.5 4.5 5 14H2v-3z"/>
                <line x1="9.5" y1="3.5" x2="12.5" y2="6.5"/>
              </svg>
              <span>Edit</span>
            </button>
            <button id="btn-draw-wall" class="fp-btn" style="display:none" title="Draw Wall">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 14V2h12v12H2z" stroke-dasharray="2 2"/>
                <path d="M2 8h12M8 2v12"/>
              </svg>
              <span>Wall</span>
            </button>
            <button id="btn-save" class="fp-btn fp-btn--success" style="display:none" title="Save changes">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 2h9l3 3v9H2z"/>
                <rect x="5" y="2" width="6" height="4"/>
                <rect x="4" y="9" width="8" height="5"/>
              </svg>
              <span>Save</span>
            </button>
            <button id="btn-cancel" class="fp-btn fp-btn--danger" style="display:none" title="Discard">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <line x1="4" y1="4" x2="12" y2="12"/>
                <line x1="12" y1="4" x2="4" y2="12"/>
              </svg>
              <span>Cancel</span>
            </button>
          </div>
          
          <div id="wall-toolbar" class="fp-wall-toolbar" style="display:none">
            <div class="fp-wall-toolbar__title">Wall Type:</div>
            <select id="wall-type-select" class="fp-select">
              <option value="exterior">Exterior (Solid, Thick)</option>
              <option value="interior">Interior (Solid, Thin)</option>
              <option value="glass">Glass (Dashed, Blue)</option>
              <option value="virtual">Virtual (Dotted, Red)</option>
            </select>
          </div>
        </div>

        <div id="edit-badge" class="fp-edit-badge">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="8" cy="8" r="6"/>
            <line x1="8" y1="5" x2="8" y2="9"/>
            <circle cx="8" cy="11.5" r=".8" fill="currentColor"/>
          </svg>
          Editing — drag assets to reposition
        </div>

        <div class="fp-sidebar__section">
          <div class="fp-sidebar__title">Room Info</div>
          <div id="room-info" class="fp-sidebar__info">Loading…</div>
        </div>

        <div class="fp-sidebar__section">
          <div class="fp-sidebar__title">Unassigned Assets</div>
          <input type="text" id="unassigned-search" class="fp-unassigned-search" placeholder="Filter assets...">
          <div id="unassigned-list" class="fp-unassigned-list">
            <!-- Populated via JS -->
          </div>
        </div>
      </aside>

      <!-- Canvas -->
      <div class="fp-canvas-wrapper" id="canvas-wrapper">
        <div id="floorplan-container"></div>
        <div class="fp-camera-controls">
          <button id="btn-zoom-in" title="Zoom In">+</button>
          <button id="btn-zoom-out" title="Zoom Out">−</button>
          <button id="btn-zoom-reset" class="text-btn" title="100%">100%</button>
          <button id="btn-zoom-fit" class="text-btn" title="Fit to screen">Fit</button>
        </div>
      </div>
    </div>

    <!-- ── Tooltip (HTML absolute) ─────────────────────────────── -->
    <div id="tooltip" class="fp-tooltip">
      <div id="tooltip-hostname" class="fp-tooltip__hostname"></div>
      <div class="fp-tooltip__row"><strong>IP</strong> <span id="tooltip-ip"></span></div>
      <div class="fp-tooltip__row"><strong>MAC</strong> <span id="tooltip-mac"></span></div>
      <div class="fp-tooltip__row"><strong>Type</strong> <span id="tooltip-type"></span></div>
    </div>

    <!-- ── Notification ────────────────────────────────────────── -->
    <div id="notification" class="fp-notification"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
